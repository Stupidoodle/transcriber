[project]
name = "transcriber"
version = "0.1.0"
description = "Local speech-to-text service: OpenAI first, faster-whisper on CPU as the fallback"
readme = "README.md"
authors = [
    { name = "Bryan", email = "71273492+Stupidoodle@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "faster-whisper>=1.2.1",
    "openai>=3.19.2",
    "pydantic-settings>=2.15.0",
    "starlette>=1.7.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
transcriber = "transcriber.app:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["faster_whisper.*"]
ignore_missing_imports = true
